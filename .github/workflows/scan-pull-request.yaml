---
name: Scan Pull Request

# Thin caller. The actual checks live centrally in the org's .github repo so
# they are maintained in a single place:
#   eclipse-dataspacetck/.github/.github/workflows/scan-pull-request.yaml
on:
  pull_request:
    branches: [ main ]
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

jobs:
  scan:
    uses: eclipse-dataspacetck/.github/.github/workflows/scan-pull-request.yaml@main
